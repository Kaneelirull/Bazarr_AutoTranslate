name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

env:
  IMAGE_NAME: kaneelir0ll/bazarr-autotranslate
  MEDIA_IDENTITY_FIX_COMMIT: 0af333475f74404daccb3f0ce13222f40d0e7cbd

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docker/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r docker/requirements.txt

      - name: Compile Python sources
        run: python -m compileall docker tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify release contains the media identity fix
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$MEDIA_IDENTITY_FIX_COMMIT" HEAD

      - name: Build Docker release candidate
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/Dockerfile
          load: true
          push: false
          tags: bazarr-autotranslate:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test packaged Python modules
        run: >-
          docker run --rm --entrypoint python
          bazarr-autotranslate:release-candidate
          -c "import media_identity, status_dashboard"

      - name: Publish immutable version and update latest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version_ref="${IMAGE_NAME}:${version}"

          if docker manifest inspect "$version_ref" >/dev/null 2>&1; then
            echo "Refusing to overwrite immutable release tag: $version_ref" >&2
            exit 1
          fi

          docker tag bazarr-autotranslate:release-candidate "$version_ref"
          docker push "$version_ref"
          version_digest="$(docker buildx imagetools inspect "$version_ref" \
            --format '{{.Manifest.Digest}}')"

          docker buildx imagetools create --prefer-index=false \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}@${version_digest}"
          latest_digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:latest" \
            --format '{{.Manifest.Digest}}')"

          if [[ "$latest_digest" != "$version_digest" ]]; then
            echo "latest digest $latest_digest does not match $version_digest" >&2
            exit 1
          fi
